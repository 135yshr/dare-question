# PR のチェック。プレビューは本番と同じ Firestore を使ってしまうので、Hosting のプレビューデプロイはしない
name: PR check
on: pull_request
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: for f in public/*.js; do node --check "$f"; done
