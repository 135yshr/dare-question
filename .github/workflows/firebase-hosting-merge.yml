# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools
# ビルド工程はないので、public/ をそのままデプロイする

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
permissions:
  contents: read
# 続けて push されても、ルールと Hosting のデプロイが前後の実行で入れ違わないよう 1 本ずつ動かす
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  # アプリとルールはセットで変わるので、ルールを先にデプロイし、失敗したら Hosting も出さない
  deploy_rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DARE_QUESTION }}
      - run: npx --yes firebase-tools@15.33.0 deploy --only firestore:rules --project dare-question --non-interactive
  build_and_deploy:
    needs: deploy_rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DARE_QUESTION }}
          channelId: live
          projectId: dare-question
